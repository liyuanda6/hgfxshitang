# 班级就餐统计系统 —— Nginx 反代配置
# 用法：
#   sudo cp meal.nginx.conf /etc/nginx/sites-available/meal
#   sudo ln -s /etc/nginx/sites-available/meal /etc/nginx/sites-enabled/meal
#   sudo nginx -t && sudo systemctl reload nginx
# 注意：server.js 需以 HOST=127.0.0.1 运行（见 meal.service）

server {
    listen 80;
    # 改成你的域名或服务器公网 IP
    server_name meal.your-domain.com;

    # 上传学生名单/批量导入时可能稍大，预留
    client_max_body_size 10m;

    # 访问与错误日志（可选）
    # access_log /var/log/nginx/meal.access.log;
    # error_log  /var/log/nginx/meal.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件下载（xlsx 导出）不超时
        proxy_read_timeout 60s;
    }
}

# ===== 启用 HTTPS（证书申请后由 certbot 自动补充，无需手动写）=====
# sudo apt install certbot python3-certbot-nginx
# sudo certbot --nginx -d meal.your-domain.com
# 之后访问 https://meal.your-domain.com ，证书每 90 天自动续期。
